# yaml-language-server: $schema=../../schema/access.v2.schema.json
# Shared by all directions: environments and roles. Changed rarely. Owner: security.
version: 2

environments: [dev, stage, prod]
production_environments: [prod]      # stricter rules apply here: ticket, expiry, separation of duties

roles:                                # a role = what it means in Vault / Kubernetes / GitLab
  viewer:      { description: read-only,                    vault: [read, list], kubernetes: view, gitlab: reporter }
  developer:   { description: day-to-day development,       vault: [read, list], kubernetes: edit, gitlab: developer }
  deployer:    { description: ships releases,               vault: [read, list, create, update], kubernetes: edit, gitlab: maintainer }
  approver:    { description: approves production releases, gitlab: maintainer }
  break-glass: { description: emergency access,             vault: [read, list, create, update, delete], kubernetes: admin, gitlab: maintainer }
